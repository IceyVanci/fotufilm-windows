# The upstream this port carries. Written by scripts/sync-upstream.ps1 when a sync lands.
upstream = "DhaliwalX/fotufilm-engine"
upstream_tag = "v1.15"
upstream_commit = "bcc776d9"
upstream_version_env = "MARKETING_VERSION=1.14 / CURRENT_PROJECT_VERSION=1024"

# The tag is the authority, not version.env: upstream went to 1.15 without bumping it, so a port
# that read the file would number its release 1.14.
upstream_release = "1.15"

# The port's own version: upstream release, then .0-w<revision>.
port_version = "1.15.0"
port_revision = "1"
port_release = "1.15.0-w1"
port_release_date = "2026-11-07"

# What built it.
swift = "6.2 (Windows), x86_64"
msvc = "14.50.35717 (Visual Studio 18 BuildTools)"
windows_sdk = "10.0.26100"
flutter = "3.41.7"
halide = "21.0.0, Vulkan enabled, ahead-of-time kernels"
vcpkg_triplet = "x64-windows-static-md"
aot_variants = 46

# What the release runs on.
arch = "x64"
cpu_baseline = "AVX2"
gpu = "Vulkan"
os = "Windows 10 1903+ / Windows 11"
media = "still images only"
